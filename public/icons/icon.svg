<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle with safe padding for maskable icons -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Inner subtle glowing border ring -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>

  <!-- Center Crest / Emblem -->
  <g filter="url(#dropShadow)" transform="translate(0, -10)">
    <!-- Graduation Cap / Mortarboard Icon -->
    <path d="M256 120 L400 185 L256 250 L112 185 Z" fill="#ffffff" />
    <!-- Cap Under-base -->
    <path d="M168 212 L168 280 C168 320 207 350 256 350 C305 350 344 320 344 280 L344 212 L256 250 Z" fill="#e0e7ff" opacity="0.9" />
    <!-- Tassel and Ribbon -->
    <path d="M380 196 L380 290 C380 300 374 308 368 312" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round" />
    <circle cx="368" cy="318" r="8" fill="#fbbf24" />

    <!-- Open Academic Book Base -->
    <path d="M140 370 C190 350 235 365 256 380 C277 365 322 350 372 370 L372 410 C322 390 277 405 256 420 C235 405 190 390 140 410 Z" fill="url(#accentGrad)" />
    <line x1="256" y1="380" x2="256" y2="420" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Brand Typography "E3" Badge -->
  <g transform="translate(256, 452)">
    <rect x="-65" y="-22" width="130" height="34" rx="17" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
    <text x="0" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">E3 PORTAL</text>
  </g>
</svg>
